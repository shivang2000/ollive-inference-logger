apiVersion: v1
kind: Service
metadata:
  name: ollive-ingestion-api
spec:
  selector: { app: ollive-ingestion-api }
  ports:
    - port: {{ .Values.ingestion.port }}
      targetPort: {{ .Values.ingestion.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-ingestion-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollive-ingestion-api }
  template:
    metadata:
      labels: { app: ollive-ingestion-api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.ingestion }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command: ["node", "apps/ingestion/dist/index.js"]
          envFrom:
            - configMapRef: { name: ollive-config }
          ports:
            - containerPort: {{ .Values.ingestion.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.ingestion.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-ingestion-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollive-ingestion-worker }
  template:
    metadata:
      labels: { app: ollive-ingestion-worker }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.ingestion }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command: ["node", "apps/ingestion/dist/worker.js"]
          envFrom:
            - configMapRef: { name: ollive-config }
---
apiVersion: v1
kind: Service
metadata:
  name: ollive-web
spec:
  selector: { app: ollive-web }
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollive-web }
  template:
    metadata:
      labels: { app: ollive-web }
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          envFrom:
            - configMapRef: { name: ollive-config }
            - secretRef: { name: ollive-secrets }
          ports:
            - containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.web.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
